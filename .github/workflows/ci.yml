name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
  switch-offs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q tests/test_switch_offs.py tests/test_paths.py
  evaluation-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev --group eval
      - name: Evaluation script on the offline fixture (no download)
        run: uv run --frozen pytest -q tests/test_evaluate_cuad.py
  search-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra search
      - name: Search tool, usage log and no-network tests with the [search] extra (fake embedder, no model download)
        run: uv run --frozen pytest -q tests/test_search.py tests/test_usage_log.py tests/test_no_network_imports.py
  public-ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Model checksum
        run: echo "2119001a06c9df6c5d8f5e7cf8f18ff3fd1c160415d31f6cd673c845e0034674  src/key_terms_mcp/models/key_terms_model.json.gz" | sha256sum -c -
      - name: Public-ready check
        run: python3 scripts/check_public_ready.py
      - name: Install gitleaks (pinned release, checksum verified)
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Secret scan (every commit in the history)
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'
