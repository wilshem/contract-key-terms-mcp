[project]
name = "contract-key-terms-mcp"
version = "1.0.0"
description = "Read-only MCP server that finds CUAD clause types in contracts with a small local sentence model"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2"]

[project.optional-dependencies]
search = ["numpy>=2", "onnxruntime>=1.20", "tokenizers>=0.20"]

[project.scripts]
contract-key-terms-mcp = "key_terms_mcp.server:main"
contract-key-terms-mcp-setup = "key_terms_mcp.setup_embeddings:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
demo = ["pillow>=11"]
eval = ["scikit-learn>=1.5", "numpy>=2"]

[tool.uv]
# Supply-chain hold: resolve only to files uploaded at least 7 days before locking.
exclude-newer = "7 days"
# huggingface-hub comes in through tokenizers (>=0.16.4,<3.0); pinned to the newest release that was at least
# 7 days old when this was locked (2.4.0, uploaded 2026-10-29).
constraint-dependencies = ["huggingface-hub==2.4.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/key_terms_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
